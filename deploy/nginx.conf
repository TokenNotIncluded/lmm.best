server {
    listen 80;
    listen [::]:80;
    server_name lmm.best;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 308 https://lmm.best$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name lmm.best;
    ssl_certificate /etc/letsencrypt/live/lmm.best/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lmm.best/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    root /var/www/lmm.best/current;
    index index.html;
    charset utf-8;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Content-Security-Policy "default-src 'none'; style-src 'self'; img-src 'self'; base-uri 'none'; frame-ancestors 'none'; form-action 'none'" always;
    add_header Cache-Control "no-cache" always;
    location = /index.html { return 308 https://lmm.best/; }
    location / { try_files $uri $uri/ =404; }
}
